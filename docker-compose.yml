services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuteur
      POSTGRES_PASSWORD: tuteur
      POSTGRES_DB: tuteur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuteur -d tuteur"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
